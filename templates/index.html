<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallex Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="text-center bg-gray-800 p-10 rounded-xl shadow-lg">
        <h1 class="text-4xl font-bold mb-4 text-indigo-400">Parallex Dashboard</h1>
        <p class="mb-8 text-gray-400">Manage your server settings easily.</p>
        
        {% if user %}
            <a href="/dashboard" class="bg-green-500 hover:bg-green-600 px-6 py-3 rounded-lg font-semibold transition">Go to Dashboard</a>
        {% else %}
            <a href="/login" class="bg-indigo-500 hover:bg-indigo-600 px-6 py-3 rounded-lg font-semibold transition">
                Login with Discord
            </a>
        {% endif %}
    </div>
</body>
</html>
