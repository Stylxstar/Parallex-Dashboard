<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Successful</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050510; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #57F287;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white flex items-center justify-center h-screen">
    <div class="glass p-12 rounded-3xl shadow-2xl text-center max-w-md border border-green-500/30">
        
        <div class="flex justify-center mb-6">
            <div class="spinner"></div>
        </div>

        <h1 class="text-3xl font-bold mb-4 text-green-400">Verified!</h1>
        <p class="text-gray-400 mb-8">Your IP has been checked. Please return to Discord. The bot is assigning your role automatically right now...</p>
        
        <a href="discord://" class="bg-indigo-600 hover:bg-indigo-500 px-8 py-3 rounded-xl font-bold transition">Return to Discord</a>
    </div>
</body>
</html>
