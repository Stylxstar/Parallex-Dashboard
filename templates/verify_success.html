<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verifying...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050510; overflow-x: hidden; margin: 0; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 48px; height: 48px; border-radius: 50%; border-left-color: #5865F2; animation: spin 1s ease infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body class="text-white flex items-center justify-center h-screen">
    <div id="canvas-container"></div>

    <div class="glass p-12 rounded-3xl shadow-2xl text-center max-w-md w-full relative z-10 border transition-colors duration-500" id="main-card">
        
        <!-- LOADING STATE -->
        <div id="loading-state">
            <div class="flex justify-center mb-6"><div class="spinner"></div></div>
            <h1 class="text-3xl font-bold mb-4 text-white">Securing Connection...</h1>
            <p class="text-gray-400">Analyzing device fingerprint & IP...</p>
        </div>

        <!-- SUCCESS STATE -->
        <div id="success-state" class="hidden">
            <div class="text-6xl mb-6">✅</div>
            <h1 class="text-3xl font-bold mb-4 text-green-400">Verified!</h1>
            <p class="text-gray-400 mb-6">You can now close this tab and return to Discord. The bot has automatically assigned your role.</p>
            <a href="discord://discord.com/channels/{{ GUILD_ID }}/{{ CHANNEL_ID }}" class="inline-block bg-indigo-600 hover:bg-indigo-500 px-8 py-3 rounded-xl font-bold transition">Return to Discord</a>
        </div>

        <!-- FAILED STATE -->
        <div id="failed-state" class="hidden">
            <div class="text-6xl mb-6">⛔</div>
            <h1 class="text-3xl font-bold mb-4 text-red-400">Verification Blocked</h1>
            <p class="text-gray-400 mb-8" id="fail-reason">Your IP is linked to another account.</p>
            <a href="discord://discord.com/channels/{{ GUILD_ID }}/{{ CHANNEL_ID }}" class="inline-block bg-gray-700 hover:bg-gray-600 px-8 py-3 rounded-xl font-bold transition">Return to Discord</a>
        </div>

    </div>

    <script>
        // Generate a basic fingerprint (Screen + Timezone + User Agent)
        function getFingerprint() {
            const str = screen.width + "x" + screen.height + navigator.userAgent + Intl.DateTimeFormat().resolvedOptions().timeZone;
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
            return hash.toString();
        }

        async function verifyUser() {
            try {
                const res = await fetch('/api/check-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session: "{{ SESSION_ID }}",
                        user: "{{ USER_ID }}",
                        guild_id: "{{ GUILD_ID }}",
                        fingerprint: getFingerprint()
                    })
                });

                const data = await res.json();

                setTimeout(() => {
                    document.getElementById('loading-state').classList.add('hidden');
                    document.title = "Verified!";
                    
                    if (data.status === "success") {
                        document.getElementById('success-state').classList.remove('hidden');
                        document.getElementById('main-card').classList.add('border-green-500/30');
                    } else {
                        document.getElementById('failed-state').classList.remove('hidden');
                        document.getElementById('fail-reason').innerText = data.reason || "Alt Account Detected.";
                        document.getElementById('main-card').classList.remove('border-white/10');
                        document.getElementById('main-card').classList.add('border-red-500/30');
                        document.title = "Blocked";
                    }
                }, 2000); // 2 seconds fake loading to look like heavy checking
                
            } catch(e) {
                document.getElementById('loading-state').innerHTML = "<h1 class='text-red-500'>Connection Error</h1>";
            }
        }

        verifyUser();

        // Three.js Background
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const geometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(1500 * 3);
        for(let i = 0; i < 1500 * 3; i++) { posArray[i] = (Math.random() - 0.5) * 15; }
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const material = new THREE.PointsMaterial({ size: 0.015, color: 0x5865F2, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;
        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = e.clientX / window.innerWidth - 0.5; mouseY = e.clientY / window.innerHeight - 0.5; });
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            particlesMesh.rotation.y = elapsedTime * 0.05;
            particlesMesh.rotation.x = elapsedTime * 0.02;
            particlesMesh.rotation.y += mouseX * 0.1;
            particlesMesh.rotation.x += mouseY * 0.1;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
