<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage {{ GUILD_NAME }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-800 p-4 shadow-md flex justify-between items-center">
        <a href="/dashboard" class="text-indigo-400 hover:text-indigo-300">&larr; Back to Servers</a>
        <h1 class="font-bold text-xl">{{ GUILD_NAME }} Settings</h1>
        <a href="/logout" class="text-red-400 hover:text-red-300">Logout</a>
    </nav>

    <div class="container mx-auto p-8 max-w-2xl">
        <div class="bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-indigo-400">Verify System Configuration</h2>

            <form method="POST" action="/manage/{{ GUILD_ID }}" class="space-y-6">
                
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Verified Role ID</label>
                    <input type="text" name="verified_role" value="{{ VERIFIED_ROLE }}" placeholder="e.g. 123456789012345678" 
                        class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Log Channel ID</label>
                    <input type="text" name="log_channel" value="{{ LOG_CHANNEL }}" placeholder="e.g. 123456789012345678" 
                        class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded transition">
                    Save Settings
                </button>
            </form>
        </div>
    </div>
</body>
</html>
