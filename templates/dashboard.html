<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallex Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-gray-800 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-indigo-400">Parallex Dashboard</h1>
        <div class="flex items-center gap-4">
            <span>{{ user.username }}</span>
            <a href="/logout" class="text-red-400 hover:text-red-300 text-sm">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto p-8">
        <h2 class="text-2xl font-semibold mb-6">Select a Server</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {% for guild in user.guilds %}
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg flex items-center gap-4 hover:bg-gray-700 transition border border-gray-700">
                <div class="w-12 h-12 bg-indigo-500 rounded-full flex items-center justify-center font-bold text-xl">
                    {{ guild.name[0] }}
                </div>
                <div>
                    <h3 class="font-bold">{{ guild.name }}</h3>
                    <a href="/manage/{{ guild.id }}" class="text-sm text-indigo-400 hover:text-indigo-300">Manage Verify System &rarr;</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
