<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Servers | Parallex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050510; color: white; min-height: 100vh; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased">
    <!-- Navbar -->
    <nav class="w-full glass border-b border-white/5 py-4 px-6 mb-10 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-lg flex items-center justify-center font-bold text-sm">P</div>
            <span class="text-xl font-bold">Parallex</span>
        </div>
        <div class="flex items-center gap-6">
            <span class="text-gray-300 font-medium">{{ USERNAME }}</span>
            <a href="/logout" class="text-sm text-red-400 hover:text-red-300 transition">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6">
        <h1 class="text-3xl font-bold mb-2">Your Servers</h1>
        <p class="text-gray-400 mb-8">Select a server to configure Parallex.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {{ SERVER_CARDS }}
        </div>
    </main>
</body>
</html>
