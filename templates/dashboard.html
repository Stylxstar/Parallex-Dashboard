<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallex Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-gray-800 p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-indigo-400">Parallex Dashboard</h1>
        <div class="flex items-center gap-4">
            <span>{{ USERNAME }}</span>
            <a href="/logout" class="text-red-400 hover:text-red-300 text-sm">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto p-8">
        <h2 class="text-2xl font-semibold mb-6">Select a Server</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {{ SERVER_CARDS }}
        </div>
    </div>
</body>
</html>
